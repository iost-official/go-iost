version: "2"

run:
  timeout: 4m
  tests: false

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - asciicheck
    - dogsled
    - gocritic
    - gomodguard_v2
    - goprintffuncname
    - testpackage
    - whitespace
    - unused
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - commentFormatting
        - appendAssign
    staticcheck:
      # Keep the former gosimple and staticcheck checks; stylecheck was disabled.
      checks:
        - "S*"
        - "SA*"
  exclusions:
    # Preserve the v1 defaults for generated code and exclusions.
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: (math/)?rand\.Seed'
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

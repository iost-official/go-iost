  E2E_Test_Local:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: "1.22"

    - run: |
        git lfs pull
        make e2e_test_local

  Linux_Test:
    runs-on: ubuntu-22.04
    env:
      GOBASE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - run: |
          git lfs pull
          make vmlib_install
          make build
          GOBIN=/usr/local/bin/ make lint-tool
          golangci-lint version
          PATH=/usr/local/bin/:$PATH make lint
      - name: Test core packages
        run: go test -timeout 600s -p 1 -count=1 ./account/... ./chainbase/... ./common/... ./consensus/... ./core/... ./crypto/... ./db/... ./ilog/... ./metrics/... ./p2p/... ./rpc/... ./sdk/...
      - name: Test vm/v8vm
        run: go test -timeout 600s -p 1 -count=1 ./vm/v8vm/...
      - name: Test integration
        run: go test -timeout 600s -p 1 -count=1 ./test/integration/...
      - name: Test other test packages
        run: go test -timeout 600s -p 1 -count=1 ./test/v8vm/... ./test/native/... ./test/gas/... || true
